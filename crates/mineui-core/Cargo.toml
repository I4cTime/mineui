[package]
name = "mineui-core"
version = "2.0.0"
edition = "2021"
description = "MineUI core business logic (no Tauri dependency)"
license = "AGPL-3.0-only"

[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "process",
    "io-util",
    "time",
    "sync",
    "fs",
    "macros",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
async-trait = "0.1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
