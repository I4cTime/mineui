[package]
name = "mineui-tauri"
version = "2.0.0"
edition = "2021"
description = "MineUI — Minecraft server manager (Tauri shell)"
license = "AGPL-3.0-only"

[lib]
name = "mineui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mineui-core = { path = "../crates/mineui-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
