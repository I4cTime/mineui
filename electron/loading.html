<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineUI - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0b0f0b 0%, #0d120d 100%);
      color: #eaf5ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 32px;
      position: relative;
    }

    .logo-cube {
      width: 100%;
      height: 100%;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Minecraft-style block */
    .block {
      position: absolute;
      width: 80px;
      height: 80px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotateX(-30deg) rotateY(45deg);
      transform-style: preserve-3d;
    }

    .block-face {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(103, 247, 143, 0.3);
      background: linear-gradient(135deg, #1a221a 0%, #131813 100%);
    }

    .block-face.top {
      transform: rotateX(90deg) translateZ(40px);
      background: linear-gradient(135deg, #67f78f 0%, #4abe6a 100%);
    }

    .block-face.front {
      transform: translateZ(40px);
    }

    .block-face.right {
      transform: rotateY(90deg) translateZ(40px);
      background: linear-gradient(135deg, #131813 0%, #0d120d 100%);
    }

    .title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #67f78f 0%, #4abe6a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: #97a697;
      margin-bottom: 40px;
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #2a352a;
      border-top-color: #67f78f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 13px;
      color: #97a697;
    }

    .status-text {
      display: inline-block;
      min-width: 180px;
      text-align: left;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .footer {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #5a6a5a;
    }

    .version {
      opacity: 0.7;
    }

    /* Grid background effect */
    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(103, 247, 143, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 247, 143, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: -1;
    }

    /* Radial gradient overlay */
    .radial-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0%, #0b0f0b 70%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="radial-overlay"></div>

  <div class="container">
    <div class="logo">
      <div class="logo-cube">
        <div class="block">
          <div class="block-face front"></div>
          <div class="block-face top"></div>
          <div class="block-face right"></div>
        </div>
      </div>
    </div>

    <h1 class="title">MineUI</h1>
    <p class="subtitle">Minecraft Server Manager</p>

    <div class="loader">
      <div class="spinner"></div>
      <span class="status">
        <span class="status-text">Starting server<span class="dots"></span></span>
      </span>
    </div>
  </div>

  <div class="footer">
    <span class="version">Loading application...</span>
  </div>
</body>
</html>
