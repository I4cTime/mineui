name: Bug Report
description: Report a bug or unexpected behavior in MineUI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.

        **If this is a security vulnerability, do NOT open an issue.** Use our [security reporting process](https://github.com/I4cTime/mineui/security/policy) instead.

  - type: input
    id: version
    attributes:
      label: MineUI version
      description: "Check Settings → About, or the installer/AppImage filename."
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Which mode was the server running in?
      options:
        - Simple mode (managed vanilla server)
        - Advanced mode (Docker container)
        - Advanced mode (Podman container)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of MineUI is affected?
      options:
        - Server Control (start/stop/restart)
        - Live Status / Logs
        - Player Management
        - RCON Console
        - Mods & Plugins
        - Configuration Editor
        - World Backups
        - System / Container Metrics
        - Themes
        - Tauri shell / installer / updater
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: "When I try to restore a backup, MineUI..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Open MineUI in Advanced mode
        2. Attach to a running container
        3. Go to Backups and click Restore
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or stack traces if available.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "Linux is the only platform built and tested today; Windows/macOS builds are best-effort."
      placeholder: "Ubuntu 24.04 (AppImage) / Windows 11 / macOS 15.3"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Container runtime version (Advanced mode only)
      description: "Output of `docker --version` or `podman --version`, if applicable."
      placeholder: "podman version 5.2.2"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context — logs, screenshots, related issues, etc.
    validations:
      required: false
